  const sectionNames={tasks:'Задачи',chat:'Чат',notes:'Заметки',notifications:'Уведомления',settings:'Настройки'};
  const navButton=(key,label,ico)=>`<button class="nav-btn ${state.section===key?'active':''}" data-section="${key}" ${state.section===key?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`;
  function renderNav(){document.getElementById('desktop-nav').innerHTML=`<div class="nav-group"><div class="nav-label">Пространство</div>${navButton('tasks','Задачи','tasks')}${navButton('chat','Чат','chat')}${navButton('notes','Заметки','note')}</div><div class="nav-group"><div class="nav-label">Планирование</div>${[['today','Сегодня'],['upcoming','Предстоящие'],['all','Все'],['done','Завершённые']].map(([key,label])=>`<button class="nav-btn ${state.section==='tasks'&&state.scope===key&&state.category==='Все'?'active':''}" data-scope="${key}">${label}</button>`).join('')}</div><div class="nav-group"><div class="nav-label">Категории</div>${['Учёба','Работа','Личное'].map(label=>`<button class="nav-btn ${state.section==='tasks'&&state.category===label?'active':''}" data-category="${label}"><span>${label}</span></button>`).join('')}</div><div class="nav-group">${navButton('notifications','Уведомления','bell')}${navButton('settings','Настройки','settings')}</div>`;document.getElementById('mobile-nav').innerHTML=[['tasks','Задачи','tasks'],['chat','Чат','chat'],['notes','Заметки','note'],['notifications','События','bell'],['settings','Настройки','settings']].map(([key,label,ico])=>`<button class="${state.section===key?'active':''}" data-section="${key}" ${state.section===key?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`).join('');document.getElementById('top-title').textContent=sectionNames[state.section];document.getElementById('mobile-title').textContent=sectionNames[state.section]}
  const dateLabel=date=>new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  const dueLabel=task=>`${dateLabel(task.date)}${task.kind==='by_date'?'':' · '+task.time}`;
  const today=()=>localDate(0);
  function scopedTasks(){return state.tasks.filter(task=>{if(state.category!=='Все'&&task.category!==state.category)return false;if(state.scope==='done')return task.status==='done';if(state.status==='open'&&(task.status==='done'||task.status==='cancelled'))return false;if(state.status==='done'&&task.status!=='done')return false;if(state.scope==='today')return task.date<=today()&&task.status!=='done'&&task.status!=='cancelled';if(state.scope==='upcoming')return task.date>=today()&&task.status!=='done'&&task.status!=='cancelled';return true}).sort((a,b)=>state.sort==='priority'?['Наивысший','Высокий','Средний','Низкий'].indexOf(a.priority)-['Наивысший','Высокий','Средний','Низкий'].indexOf(b.priority):state.sort==='created'?b.id-a.id:a.date.localeCompare(b.date)||a.time.localeCompare(b.time))}
  function taskRow(task){return `<div class="task-row" data-od-id="task-row-${task.id}"><button class="complete ${task.status==='done'?'done':''}" data-complete="${task.id}" aria-label="${task.status==='done'?'Вернуть в работу':'Завершить'}: ${escapeHTML(task.title)}"></button><button class="task-main ${task.status==='done'?'done':''}" data-detail="${task.id}"><span class="task-name">${escapeHTML(task.title)}</span><span class="task-meta">${escapeHTML(task.category)}<span class="dot">•</span>${escapeHTML(task.status==='in_progress'?'В работе':task.status==='cancelled'?'Отменено':task.priority)}</span></button><div class="task-end"><span class="priority-dot ${task.priority==='Наивысший'?'highest':task.priority==='Низкий'?'low':''}"></span><span class="task-due ${task.date<today()&&task.status!=='done'?'overdue':''}">${dueLabel(task)}</span><button class="row-more" data-detail="${task.id}" aria-label="Подробности: ${escapeHTML(task.title)}">${icon('more')}</button></div></div>`}
  function section(title,tasks,subtitle=''){return tasks.length?`<section class="task-section"><h2 class="section-title">${title}<small>${subtitle||tasks.length}</small></h2><div class="task-list">${tasks.map(taskRow).join('')}</div></section>`:''}
  function renderList(tasks){if(!tasks.length)return '<div class="empty"><strong>Здесь пока нет задач</strong>Попробуйте другой фильтр или добавьте задачу.</div>';const overdue=tasks.filter(task=>task.date<today()&&task.status!=='done'&&task.status!=='cancelled');const current=tasks.filter(task=>!overdue.includes(task));return section('Просрочено',overdue,'Требуют внимания')+section(state.scope==='today'?'Сегодня':state.scope==='upcoming'?'Предстоящие':state.scope==='done'?'Завершённые':'Все задачи',current)}
  function calendarDays(){const [year,month]=state.month.split('-').map(Number);const start=new Date(year,month-1,1);const shift=(start.getDay()+6)%7;return Array.from({length:42},(_,index)=>{const date=new Date(year,month-1,1-shift+index);return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`})}
  function renderCalendar(tasks){const days=calendarDays();const monthName=new Date(state.month+'-01T12:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});return `<div class="calendar-controls"><label class="field-label">Месяц<input class="field" id="month" type="month" value="${state.month}"></label><span>${monthName}</span></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(day=>`<span class="calendar-label">${day}</span>`).join('')}${days.map(date=>`<div class="calendar-cell ${date.slice(0,7)!==state.month?'outside':''}"><time datetime="${date}">${Number(date.slice(-2))}</time>${tasks.filter(task=>task.date===date).map(task=>`<button class="calendar-entry" data-detail="${task.id}">${escapeHTML(task.title)}</button>`).join('')}</div>`).join('')}</div><div class="calendar-agenda">${section('Задачи месяца',tasks.filter(task=>task.date.slice(0,7)===state.month))}</div>`}
  function renderKanban(tasks){return `<div class="kanban" aria-label="Канбан">${[['todo','К выполнению'],['in_progress','В работе'],['done','Готово'],['cancelled','Отменено']].map(([status,label])=>`<section class="kanban-col"><h2>${label} · ${tasks.filter(task=>task.status===status).length}</h2>${tasks.filter(task=>task.status===status).map(task=>`<button class="kanban-card" data-detail="${task.id}"><strong>${escapeHTML(task.title)}</strong><small>${escapeHTML(task.category)} · ${dueLabel(task)}</small></button>`).join('')}</section>`).join('')}</div>`}
  function renderTasks(){const tasks=scopedTasks();const heading=state.category!=='Все'?state.category:({today:'Сегодня',upcoming:'Предстоящие',all:'Все задачи',done:'Завершённые'})[state.scope];return `<div class="page ${state.view==='kanban'?'wide':''}" data-od-id="tasks-page"><div class="page-head"><div><p class="eyebrow">Планирование</p><h1 data-od-id="tasks-heading">${heading}</h1><p class="subtitle">${tasks.length} ${tasks.length===1?'задача':'задач'} · важное в фокусе</p></div><div class="head-actions"><button class="button primary" data-action="new-task" data-od-id="add-task">${icon('plus')}Добавить задачу</button></div></div><div class="toolbar glass" data-od-id="task-toolbar"><div class="view-tabs" role="group" aria-label="Вид задач">${[['list','Список'],['calendar','Календарь'],['kanban','Канбан']].map(([key,label])=>`<button data-view="${key}" class="${state.view===key?'active':''}" aria-pressed="${state.view===key}">${label}</button>`).join('')}</div><div class="secondary-tools"><button class="ghost" data-action="filters" aria-expanded="${state.filterOpen}">${icon('filter')}Фильтры</button></div></div>${state.filterOpen?`<div class="filter-panel" data-od-id="task-filters"><label class="field-label">Статус<select class="field" id="status-filter"><option value="open" ${state.status==='open'?'selected':''}>Открытые</option><option value="done" ${state.status==='done'?'selected':''}>Готовые</option><option value="all" ${state.status==='all'?'selected':''}>Все</option></select></label><label class="field-label">Категория<select class="field" id="category-filter">${['Все','Учёба','Работа','Личное'].map(value=>`<option ${state.category===value?'selected':''}>${value}</option>`).join('')}</select></label><label class="field-label">Сортировка<select class="field" id="sort-filter"><option value="deadline" ${state.sort==='deadline'?'selected':''}>По сроку</option><option value="priority" ${state.sort==='priority'?'selected':''}>По приоритету</option><option value="created" ${state.sort==='created'?'selected':''}>Новые сначала</option></select></label></div>`:''}${state.category!=='Все'?`<span class="active-filter">${escapeHTML(state.category)}</span>`:''}${state.view==='list'?renderList(tasks):state.view==='calendar'?renderCalendar(tasks):renderKanban(tasks)}</div>`}
  const currentChat=()=>state.chats.find(chat=>chat.id===state.chatId);
  function renderChat(){const chat=currentChat();return `<div class="chat-layout" data-od-id="chat-page"><div class="chat-flow">${chat.messages.length?chat.messages.map(message=>`<div class="message ${message.mine?'mine':''}">${escapeHTML(message.text)}</div>`).join(''):`<div class="chat-empty"><div><p class="eyebrow">Obsidian Relay</p><h1>Что запишем сегодня?</h1><p class="subtitle">Задачи со сроком, заметки и вопросы — в одном диалоге.</p></div></div>`}</div><div class="composer glass" data-od-id="chat-composer"><textarea id="chat-draft" aria-label="Сообщение" placeholder="${state.chatMode==='task'?'Что нужно сделать и к какому сроку…':'Напишите сообщение…'}">${escapeHTML(chat.draft)}</textarea><div class="composer-foot"><button class="mode-control" data-action="mode" aria-label="Режим ИИ: ${state.chatMode==='task'?'Задача':'Заметка'}">${icon(state.chatMode==='task'?'tasks':'note')}${state.chatMode==='task'?'Задача':'Заметка'}</button><button class="ghost" data-action="new-chat">Новый чат</button><span class="spacer"></span><button class="icon-btn" data-action="send-chat" aria-label="Отправить">${icon('arrow')}</button></div></div></div>`}
  function renderNotes(){return `<div class="page" data-od-id="notes-page"><div class="page-head"><div><p class="eyebrow">Хранилище</p><h1>Заметки и люди</h1><p class="subtitle">Карточки для мыслей, материалов и контактов.</p></div><button class="button primary" data-action="new-note">${icon('plus')}Добавить заметку</button></div><div class="panel">${state.notes.map((note,index)=>`<button class="history-item" style="padding:16px 24px;border-bottom:1px solid var(--border)" data-note="${index}"><strong>${escapeHTML(note.title)}</strong><small>${escapeHTML(note.kind)} · ${escapeHTML(note.text.slice(0,90))}</small></button>`).join('')}</div></div>`}
  function renderSettings(){return `<div class="page" data-od-id="settings-page"><div class="page-head"><div><p class="eyebrow">Приложение</p><h1>Настройки</h1><p class="subtitle">Демонстрация структуры. Подключение и сохранение доступны в React-интеграции.</p></div></div><div class="panel"><section class="panel-section"><h2>ИИ и память</h2><p>Выбор модели, предпочтения и память остаются в действующем приложении.</p><div class="settings-row"><span>Память чата<small>Использовать контекст разговора</small></span><button class="switch ${state.settings.memory?'on':''}" data-toggle="memory" role="switch" aria-checked="${state.settings.memory}" aria-label="Память чата"><span></span></button></div></section><section class="panel-section"><h2>Автоматизации и уведомления</h2><div class="settings-row"><span>Уведомления<small>Напоминания и события синхронизации</small></span><button class="switch ${state.settings.notifications?'on':''}" data-toggle="notifications" role="switch" aria-checked="${state.settings.notifications}" aria-label="Уведомления"><span></span></button></div></section><section class="panel-section"><h2>Подключение и безопасность</h2><p>Устройства, Git-конфликты и защита данных — отдельные разделы текущих настроек.</p><div class="settings-row"><span>Состояние подключения</span><strong>Демо без сервера</strong></div></section></div></div>`}
  function renderNotifications(){return `<div class="page" data-od-id="notifications-page"><div class="page-head"><div><p class="eyebrow">Активность</p><h1>Уведомления</h1><p class="subtitle">В интеграции сюда поступают реальные события приложения.</p></div></div><div class="panel"><div class="panel-section"><h2>Нет новых уведомлений</h2><p>Здесь появятся напоминания и события синхронизации.</p></div></div></div>`}
  function render(){renderNav();document.getElementById('main').innerHTML=({tasks:renderTasks,chat:renderChat,notes:renderNotes,settings:renderSettings,notifications:renderNotifications})[state.section]();renderOverlay()}
  let previousFocus=null;
  function openModal(type,id){previousFocus=document.activeElement;state.modal=type;state.detailId=id??null;renderOverlay();document.querySelector('.modal input,.modal textarea,.modal button,.drawer button')?.focus()}
  function closeModal(){state.modal=null;renderOverlay();previousFocus?.focus()}
  function taskForm(task){return `<form id="task-form"><label class="field-label">Название<input class="field" name="title" required maxlength="200" value="${escapeHTML(task?.title||'')}"></label><label class="field-label">Описание<textarea class="field" name="description">${escapeHTML(task?.description||'')}</textarea></label><div class="form-grid"><label class="field-label">Категория<select class="field" name="category">${['Учёба','Работа','Личное'].map(value=>`<option ${value===(task?.category||'Личное')?'selected':''}>${value}</option>`).join('')}</select></label><label class="field-label">Приоритет<select class="field" name="priority">${['Наивысший','Высокий','Средний','Низкий'].map(value=>`<option ${value===(task?.priority||'Средний')?'selected':''}>${value}</option>`).join('')}</select></label><label class="field-label">Тип срока<select class="field" name="kind" id="deadline-kind"><option value="by_date" ${!task||task.kind==='by_date'?'selected':''}>До даты включительно</option><option value="by_time" ${task?.kind==='by_time'?'selected':''}>До времени</option><option value="at_time" ${task?.kind==='at_time'?'selected':''}>В указанное время</option></select></label><label class="field-label">Дата<input class="field" name="date" type="date" required value="${task?.date||today()}"></label><label class="field-label" id="time-label" ${!task||task.kind==='by_date'?'hidden':''}>Время<input class="field" name="time" type="time" value="${task?.time||''}"></label><label class="field-label">Часовой пояс<input class="field" name="timezone" required value="${escapeHTML(task?.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Moscow')}"></label></div><div class="form-grid"><label class="field-label">Метки<input class="field" name="tags" value="${escapeHTML(task?.tags||'')}"></label><label class="field-label">Ключевые слова<input class="field" name="keywords" value="${escapeHTML(task?.keywords||'')}"></label></div><div class="form-actions"><button type="button" class="button" data-action="close-modal">Отмена</button><button class="button primary">${task?'Сохранить':'Добавить задачу'}</button></div></form>`}
  function renderOverlay(){const root=document.getElementById('overlay-root');if(!state.modal){root.innerHTML='';return}if(state.modal==='history'){root.innerHTML=`<div class="drawer-backdrop" data-action="close-modal"></div><aside class="drawer glass" role="dialog" aria-modal="true" aria-label="История чатов"><div class="drawer-head"><h2>История чатов</h2><button class="icon-btn" data-action="close-modal" aria-label="Закрыть">${icon('close')}</button></div><p class="subtitle">Черновики сохраняются при переключении.</p><button class="button primary" data-action="new-chat">${icon('plus')}Новый чат</button><div style="margin-top:20px">${state.chats.map(chat=>`<button class="history-item" data-open-chat="${chat.id}"><strong>${escapeHTML(chat.title)}</strong><small>${chat.messages.length} сообщений</small></button>`).join('')}</div></aside>`}else{const task=state.tasks.find(item=>item.id===state.detailId);const title=state.modal==='task'?task?'Редактировать задачу':'Новая задача':state.modal==='detail'?task?.title:state.modal==='note'?'Заметка':'Режим ИИ';let body='';if(state.modal==='task')body=taskForm(task);if(state.modal==='detail'&&task)body=`<div class="detail-grid"><dl><dt>Срок</dt><dd>${task.kind==='by_date'?'До даты включительно':task.kind==='by_time'?'До времени':'В указанное время'} · ${dueLabel(task)} · ${escapeHTML(task.timezone)}</dd></dl><dl><dt>Статус</dt><dd><select class="field" id="detail-status">${[['todo','К выполнению'],['in_progress','В работе'],['done','Готово'],['cancelled','Отменено']].map(([value,label])=>`<option value="${value}" ${task.status===value?'selected':''}>${label}</option>`).join('')}</select></dd></dl><dl><dt>Категория</dt><dd>${escapeHTML(task.category)}</dd></dl><dl><dt>Приоритет</dt><dd>${escapeHTML(task.priority)}</dd></dl><dl><dt>Описание</dt><dd>${escapeHTML(task.description||'—')}</dd></dl><dl><dt>Метки</dt><dd>${escapeHTML(task.tags||'—')}</dd></dl><dl><dt>Ключевые слова</dt><dd>${escapeHTML(task.keywords||'—')}</dd></dl></div><div class="form-actions" style="margin-top:24px"><button class="button" data-action="close-modal">Закрыть</button><button class="button primary" data-action="edit-task">Редактировать</button></div>`;if(state.modal==='mode')body=`<p class="subtitle">Выберите, что ИИ должен создать из диалога.</p><div class="detail-grid"><button class="button" data-mode="task">Задача · со сроком</button><button class="button" data-mode="note">Заметка · свободная запись</button></div>`;if(state.modal==='note')body=`<form id="note-form"><label class="field-label">Название<input class="field" name="title" required value="${escapeHTML(state.notes[state.detailId]?.title||'')}"></label><label class="field-label">Тип<select class="field" name="kind">${['Заметка','Идея','Человек'].map(value=>`<option ${state.notes[state.detailId]?.kind===value?'selected':''}>${value}</option>`).join('')}</select></label><label class="field-label">Текст<textarea class="field" name="text" required>${escapeHTML(state.notes[state.detailId]?.text||'')}</textarea></label><div class="form-actions"><button type="button" class="button" data-action="close-modal">Отмена</button><button class="button primary">Сохранить</button></div></form>`;root.innerHTML=`<div class="modal-wrap"><div class="modal-backdrop" data-action="close-modal"></div><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${escapeHTML(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Закрыть">${icon('close')}</button></div>${body}</section></div>`}document.querySelector('.app')?.setAttribute('inert','')}
  document.addEventListener('click',event=>{const target=event.target.closest('button,[data-action]');if(!target)return;if(target.dataset.section){state.section=target.dataset.section;render();return}if(target.dataset.scope){state.section='tasks';state.scope=target.dataset.scope;state.category='Все';state.status=state.scope==='done'?'all':'open';render();return}if(target.dataset.category){state.section='tasks';state.category=target.dataset.category;state.scope='all';render();return}if(target.dataset.view){state.view=target.dataset.view;render();return}if(target.dataset.complete){const task=state.tasks.find(item=>item.id===Number(target.dataset.complete));task.status=task.status==='done'?'todo':'done';render();return}if(target.dataset.detail){openModal('detail',Number(target.dataset.detail));return}if(target.dataset.note!==undefined){openModal('note',Number(target.dataset.note));return}if(target.dataset.openChat){state.chatId=Number(target.dataset.openChat);state.section='chat';state.modal=null;document.querySelector('.app')?.removeAttribute('inert');render();return}if(target.dataset.mode){state.chatMode=target.dataset.mode;closeModal();render();return}if(target.dataset.toggle){state.settings[target.dataset.toggle]=!state.settings[target.dataset.toggle];render();return}switch(target.dataset.action){case'new-task':openModal('task');break;case'filters':state.filterOpen=!state.filterOpen;render();break;case'history':openModal('history');break;case'close-modal':document.querySelector('.app')?.removeAttribute('inert');closeModal();break;case'edit-task':state.modal='task';renderOverlay();document.querySelector('.modal input')?.focus();break;case'new-note':openModal('note');break;case'mode':openModal('mode');break;case'new-chat':state.chats.push({id:Date.now(),title:'Новый чат',messages:[],draft:''});state.chatId=state.chats.at(-1).id;state.section='chat';state.modal=null;document.querySelector('.app')?.removeAttribute('inert');render();break;case'send-chat':{const chat=currentChat();const draft=document.getElementById('chat-draft')?.value.trim();if(!draft)return;chat.messages.push({mine:true,text:draft});chat.title=chat.messages.length===1?draft.slice(0,36):chat.title;chat.draft='';render();break}}});
  document.addEventListener('input',event=>{if(event.target.id==='chat-draft')currentChat().draft=event.target.value});
  document.addEventListener('change',event=>{const element=event.target;if(element.id==='status-filter')state.status=element.value;else if(element.id==='category-filter')state.category=element.value;else if(element.id==='sort-filter')state.sort=element.value;else if(element.id==='month')state.month=element.value;else if(element.id==='detail-status'){const task=state.tasks.find(item=>item.id===state.detailId);task.status=element.value;renderOverlay();return}else if(element.id==='deadline-kind'){const time=document.getElementById('time-label');time.hidden=element.value==='by_date';time.querySelector('input').required=element.value!=='by_date';return}else return;render()});
  document.addEventListener('submit',event=>{if(event.target.id==='task-form'){event.preventDefault();const data=new FormData(event.target);const item={title:String(data.get('title')).trim(),description:String(data.get('description')).trim(),category:String(data.get('category')),priority:String(data.get('priority')),kind:String(data.get('kind')),date:String(data.get('date')),time:String(data.get('time')),timezone:String(data.get('timezone')).trim(),status:'todo',tags:String(data.get('tags')).trim(),keywords:String(data.get('keywords')).trim()};if(item.kind!=='by_date'&&!item.time)return;try{new Intl.DateTimeFormat('ru-RU',{timeZone:item.timezone})}catch{alert('Укажите корректный часовой пояс');return}if(state.detailId){Object.assign(state.tasks.find(task=>task.id===state.detailId),item)}else state.tasks.push({...item,id:state.nextId++});document.querySelector('.app')?.removeAttribute('inert');closeModal();render()}if(event.target.id==='note-form'){event.preventDefault();const data=new FormData(event.target);const note={title:String(data.get('title')),kind:String(data.get('kind')),text:String(data.get('text'))};if(state.detailId!==null)state.notes[state.detailId]=note;else state.notes.push(note);document.querySelector('.app')?.removeAttribute('inert');closeModal();render()}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal){event.preventDefault();document.querySelector('.app')?.removeAttribute('inert');closeModal()}if(event.key==='Tab'&&state.modal){const container=document.querySelector('.modal,.drawer');const focusables=[...container.querySelectorAll('button,input,select,textarea')].filter(element=>!element.disabled&&!element.hidden&&element.getClientRects().length);const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
  render();
