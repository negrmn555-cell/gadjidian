services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    container_name: obsidian-relay
    restart: unless-stopped
    mem_limit: 1536m
    pids_limit: 128
    cpus: ${RELAY_CPUS:-1}
    env_file: ../.env
    environment:
      DATA_DIR: /data
      VAULT_PATH: /data/vault
      STATIC_DIR: /app/packages/app/dist
      NODE_OPTIONS: --max-old-space-size=512
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - relay-data:/data
      # SSH key for git remote (read-only). Generate: ssh-keygen -t ed25519 -f deploy/ssh/id_ed25519 -N ""
      - ./ssh:/home/node/.ssh:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: obsidian-relay-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay

volumes:
  relay-data:
  caddy-data:
  caddy-config:
